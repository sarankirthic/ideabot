<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Suggestion Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Idea Suggestion Chatbot</h1>
        <textarea id="user-input" placeholder="Enter your topic..."></textarea>
        <button onclick="getIdea()">Get Idea</button>
        <div id="response"></div>
    </div>

    <script>
        async function getIdea() {
            const userInput = document.getElementById("user-input").value;
            const responseDiv = document.getElementById("response");

            const response = await fetch('/get_idea', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userInput })
            });

            const data = await response.json();
            responseDiv.innerHTML = data.idea || "Error: " + data.error;
        }
    </script>
</body>
</html>
